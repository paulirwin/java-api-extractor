# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel in-flight runs for the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write       # dorny/test-reporter
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21', '25' ]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'microsoft'
          cache: maven

      # Cache the download/ dir used by ExtractRunnerIT so it doesn't re-fetch
      # from Maven Central on every CI run. Key on the IT source so any change
      # to library coordinates invalidates the cache.
      - name: Cache integration-test downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: download
          key: it-downloads-${{ hashFiles('src/test/java/io/github/paulirwin/javaapiextractor/ExtractRunnerIT.java') }}
          restore-keys: |
            it-downloads-

      - name: Build with Maven
        run: mvn -B -ntp verify --file pom.xml

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2  # v3.0.0
        if: always()
        with:
          name: Tests (JDK ${{ matrix.java-version }})
          path: 'target/*-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-reports-jdk${{ matrix.java-version }}
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: matrix.java-version == '21'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          files: target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive.
      # Only run once across the matrix.
      - name: Update dependency graph
        if: matrix.java-version == '21' && github.event_name == 'push'
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8  # v5.0.0
        with:
          maven-args: '-ntp'
