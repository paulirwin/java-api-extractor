name: Release

# Triggered by pushing a tag like v1.2.3 or v1.2.3-rc1.
# Builds, runs the full test suite, publishes to GitHub Packages,
# and creates a GitHub Release with auto-generated notes (see
# .github/release.yml for category mapping).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create releases, upload assets
  packages: write   # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Validate tag is SemVer
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not SemVer (expected vMAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set Maven version from tag
        run: mvn -B -ntp versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B -ntp verify --file pom.xml

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp deploy -DskipTests --file pom.xml

      - name: Stage release assets
        id: assets
        run: |
          mkdir -p release-assets
          version="${{ steps.version.outputs.version }}"
          jar="target/java-api-extractor-${version}.jar"
          if [[ ! -f "$jar" ]]; then
            echo "::error::Expected jar not found: $jar"
            ls -la target/
            exit 1
          fi
          cp "$jar" release-assets/
          # Bundle the runtime lib/ alongside the jar so a downloader gets a runnable set.
          if [[ -d target/lib ]]; then
            tar -C target -czf "release-assets/java-api-extractor-${version}-with-deps.tar.gz" \
              "java-api-extractor-${version}.jar" lib
          fi
          ls -la release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --draft so you can review the auto-generated notes before publishing.
          args=(--draft --generate-notes --title "${{ github.ref_name }}")
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${{ github.ref_name }}" "${args[@]}" release-assets/*
